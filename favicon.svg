<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D23"/>
      <stop offset="100%" stop-color="#0E1013"/>
    </linearGradient>
    <linearGradient id="favRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEFF00"/>
      <stop offset="100%" stop-color="#9BC000"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring with Neon Border -->
  <circle cx="32" cy="32" r="30" fill="url(#favBg)" stroke="url(#favRing)" stroke-width="2.5"/>

  <!-- Male Developer Silhouette & Tech Hoodie -->
  <g id="devChar">
    <!-- Dark Tech Hoodie Body -->
    <path d="M14 58c0-9 8-16 18-16s18 7 18 16" fill="#1F242C"/>
    <!-- Hoodie V-neck / zipper -->
    <path d="M25 42l7 7 7-7" fill="#14171C" stroke="#DEFF00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Neck -->
    <path d="M28 33h8v10h-8z" fill="#E5B582"/>

    <!-- Face -->
    <path d="M21 24c0 6 4.9 11 11 11s11-5 11-11v-4H21V24z" fill="#F0C294"/>

    <!-- Sharp Modern Textured Hair -->
    <path d="M20 23c-.4-6 2.5-13 12-13 8 0 12 5.5 12 11.5 0 1.2-.2 2.2-.5 3-1.5-1.2-4-1.8-7-1.8-4.2 0-6.8 1.2-9.8.6-1.2-.2-3.3-.6-6.7-.3z" fill="#181B20"/>
    <path d="M22 15c4.5-3.8 12-4.2 17.5-.8-1.8-1.2-5.2-2.2-9-2.2-3.8 0-6.3 1.2-8.5 3z" fill="#2C323D"/>

    <!-- Sleek Black Acetate Glasses with Lime Reflex -->
    <rect x="23" y="23" width="7.2" height="5.2" rx="1.5" fill="#111317" stroke="#DEFF00" stroke-width="1.3"/>
    <rect x="33.8" y="23" width="7.2" height="5.2" rx="1.5" fill="#111317" stroke="#DEFF00" stroke-width="1.3"/>
    <line x1="30.2" y1="25.2" x2="33.8" y2="25.2" stroke="#DEFF00" stroke-width="1.3"/>
    <line x1="24.5" y1="24.5" x2="28.5" y2="24.5" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
    <line x1="35.3" y1="24.5" x2="39.3" y2="24.5" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>

    <!-- Confident Smile -->
    <path d="M29 31.5c1.8 1 4.2 1 6 0" stroke="#8C5E3C" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Floating Glowing Code Badge -->
    <g transform="translate(36, 38)">
      <circle cx="10" cy="10" r="9" fill="#0E1013" stroke="#DEFF00" stroke-width="1.8"/>
      <path d="M8 8L6 10l2 2M12 8l2 2-2 2M11 7l-2 6" stroke="#DEFF00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>

